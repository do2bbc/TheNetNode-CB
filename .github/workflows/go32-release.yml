name: GO32 DOS test package

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl dosbox unzip zip
      - name: Install pinned DJGPP and CWSDPMI
        run: |
          curl -fL --retry 3 https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2 -o "$RUNNER_TEMP/djgpp.tar.bz2"
          echo '8464f17017d6ab1b2bb2df4ed82357b5bf692e6e2b7fee37e315638f3d505f00  '"$RUNNER_TEMP/djgpp.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/djgpp.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/djgpp/bin" >> "$GITHUB_PATH"
          curl -fL --retry 3 https://www.delorie.com/pub/djgpp/current/v2misc/csdpmi7b.zip -o "$RUNNER_TEMP/csdpmi7b.zip"
          echo 'deacda0488e1cdd7c4a9f32fab45662b34c0ed6b2d7d4d13bc07041b62004a8c  '"$RUNNER_TEMP/csdpmi7b.zip" | sha256sum -c -
      - name: Build and verify DOS package
        env:
          CWSDPMI_ZIP: ${{ runner.temp }}/csdpmi7b.zip
        run: sh tests/package-go32.sh "$RUNNER_TEMP/go32-package"
      - uses: actions/upload-artifact@v6
        with:
          name: TNN-CB-GO32-test
          path: ${{ runner.temp }}/go32-package/*
          if-no-files-found: error
  release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: TNN-CB-GO32-test
          path: go32-package
      - name: Attach ZIP and checksum to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" go32-package/* --clobber
