name: Debian CB packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git ca-certificates dpkg-dev python3 qemu-user gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross linux-libc-dev
      - uses: actions/checkout@v6
      - name: Build Debian 12 package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tests/package-debian.sh "${{ matrix.arch }}" /tmp/debian-package
      - name: Verify packaged executable
        run: python3 tests/debian-package.py /tmp/debian-package/*.deb "${{ matrix.arch }}"
      - name: Verify apt installation with real target dependencies
        run: |
          dpkg --add-architecture "${{ matrix.arch }}"
          apt-get update
          apt-get -y -o 'Dpkg::Options::=--path-include=/usr/share/doc/tnn-cb/*' install /tmp/debian-package/*.deb
          test -x /usr/bin/tnn-cb
          test -f /usr/share/doc/tnn-cb/SOURCE.tar.gz
          test -f /usr/share/doc/tnn-cb/examples/tnn.ini
          test ! -e /usr/local/tnn
          dpkg --verify tnn-cb
          apt-get remove -y tnn-cb
          test ! -e /usr/bin/tnn-cb
      - name: Native regression suites
        if: matrix.arch == 'amd64'
        run: |
          sh tests/gcc-regressions.sh
          sh tests/runtime-regressions.sh
          sh tests/convers-links.sh
          sh tests/tcpkiss.sh
          sh tests/startup-banner.sh
          sh tests/socket-set.sh
          sh tests/monitor-hostmode.sh
          sh tests/kiss-multiport.sh
          sh tests/hostmode-reconnect.sh
      - uses: actions/upload-artifact@v6
        with:
          name: TNN-CB-Debian12-${{ matrix.arch }}
          path: /tmp/debian-package/*
          if-no-files-found: error
  release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: TNN-CB-Debian12-*
          merge-multiple: true
          path: debian-packages
      - name: Attach packages and checksums to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" debian-packages/* --clobber
